# Styling for the demo recording: two titled panes, no status bar clutter.
set -g default-terminal "tmux-256color"
set -g status off
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#fab387"
set -g pane-border-format "#[bold]#{?pane_active,#[fg=#1e1e2e#,bg=#fab387],#[fg=#1e1e2e#,bg=#89b4fa]} #{pane_title} #[default]"
set -g mouse off
