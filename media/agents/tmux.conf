# Agent fleet recording: manager on top, one titled pane per worker below (TokyoNight).
set -g default-terminal "tmux-256color"
set -g status off
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#3b4261"
set -g pane-border-format "#[bold,fg=#16161e,bg=#{@color}] #{pane_title} #[default]"
set -g mouse off
set -g escape-time 0
