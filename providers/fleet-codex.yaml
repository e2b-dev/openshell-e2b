# Provider profile for Codex with an OpenAI API key, in the openshell-workload-agents
# template. Based on OpenShell's providers/openai.yaml (Apache-2.0). Changes: the id,
# and the binary: only the Codex CLI at /usr/bin/codex may use the key. Codex reads
# CODEX_API_KEY in `codex exec`, so the placeholder is set under both names.
# (OpenShell's providers/codex.yaml is for ChatGPT sign-in tokens instead.)
#   openshell provider profile import -f providers/fleet-codex.yaml --global
id: fleet-codex
display_name: Codex (fleet)
description: Codex CLI with an OpenAI API key
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key used by Codex
    env_vars: [CODEX_API_KEY, OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/codex]
